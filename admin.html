<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Luary</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="h-full flex flex-col justify-between">

    <!-- TELA DE LOGIN -->
    <div id="login-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-900 bg-opacity-75 hidden">
        <div class="max-w-md w-full bg-white rounded-xl shadow-2xl p-8 m-4">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-extrabold text-gray-900">Luary Admin</h2>
                <p class="text-sm text-gray-600 mt-2">Acesse com suas credenciais autorizadas</p>
            </div>
            <form id="login-form" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700">E-mail</label>
                    <input type="email" id="login-email" required class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Senha</label>
                    <input type="password" id="login-password" required class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div id="login-error" class="text-red-500 text-sm hidden"></div>
                <button type="submit" class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg shadow-md transition duration-200">
                    Entrar no Sistema
                </button>
            </form>
        </div>
    </div>

    <!-- PAINEL ADMINISTRATIVO -->
    <div id="admin-panel" class="min-h-full flex flex-col hidden">
        <header class="bg-white shadow-sm border-b border-gray-200">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <span class="text-xl font-bold text-indigo-600"><i class="fa-solid fa-gem mr-2"></i>Luary Dashboard</span>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="user-email-display" class="text-sm text-gray-600 font-medium"></span>
                    <button id="logout-btn" class="bg-gray-100 hover:bg-red-50 hover:text-red-600 text-gray-700 px-4 py-2 rounded-lg text-sm font-medium transition duration-150">
                        <i class="fa-solid fa-right-from-bracket mr-2"></i>Sair
                    </button>
                </div>
            </div>
        </header>

        <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
            <!-- Cards de Métricas -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                    <h3 class="text-sm font-medium text-gray-500">Produtos Cadastrados</h3>
                    <p class="text-3xl font-bold text-gray-900 mt-2" id="metric-products-count">--</p>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                    <h3 class="text-sm font-medium text-gray-500">Canal de Vendas</h3>
                    <p class="text-3xl font-bold text-gray-900 mt-2">Atacado</p>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                    <h3 class="text-sm font-medium text-gray-500">Status da CDN (jsDelivr)</h3>
                    <p class="text-3xl font-bold text-green-600 mt-2">Online</p>
                </div>
            </div>

            <!-- Cadastro de Produto -->
            <div class="bg-white shadow-sm rounded-xl border border-gray-200 p-6">
                <div class="border-b border-gray-200 pb-4 mb-6">
                    <h2 class="text-xl font-bold text-gray-800"><i class="fa-solid fa-box-open mr-2 text-indigo-600"></i>Novo Produto / Referência</h2>
                    <p class="text-sm text-gray-500 mt-1">Preencha os dados. O sistema mapeará até 10 fotos na pasta individual do SKU via CDN (`luary-cdn`).</p>
                </div>

                <form id="product-form" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">SKU / Referência</label>
                            <input type="text" id="prod-sku" required placeholder="Ex: LUA-1020" class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Título do Produto</label>
                            <input type="text" id="prod-name" required placeholder="Ex: Anel Solitário Cravejado" class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Categoria</label>
                            <input type="text" id="prod-category" required placeholder="Ex: Anéis" class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Preço Atacado (R$)</label>
                            <input type="number" step="0.01" id="prod-price-wholesale" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Preço Varejo (R$)</label>
                            <input type="number" step="0.01" id="prod-price-retail" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
                        </div>
                    </div>

                    <div class="border-t border-gray-200 pt-6">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Imagens do Produto (Até 10 fotos)</label>
                        <input type="file" id="prod-images" multiple accept="image/*" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer">
                        <div id="image-preview-container" class="mt-4 grid grid-cols-2 sm:grid-cols-5 gap-4 hidden"></div>
                    </div>

                    <div class="flex justify-end space-x-4 border-t border-gray-200 pt-6">
                        <button type="submit" id="submit-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2.5 rounded-lg font-medium shadow-sm transition">
                            <i class="fa-solid fa-cloud-arrow-up mr-2"></i>Salvar Produto no Firestore
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <!-- Scripts Firebase e Lógica -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCanlMwdfuD9gmVt62nJYYetj4K2-BfWEc",
            authDomain: "luary-system.firebaseapp.com",
            projectId: "luary-system",
            storageBucket: "luary-system.firebasestorage.app",
            messagingSenderId: "996287172742",
            appId: "1:996287172742:web:4ff8c22a01cabe4015c107"
        };

        // Configuração do Repositório CDN dedicado de Imagens
        const CDN_USER = "luaryshop";
        const CDN_REPO = "luary-cdn";
        const CDN_BRANCH = "main";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const loginScreen = document.getElementById('login-screen');
        const adminPanel = document.getElementById('admin-panel');
        const loginForm = document.getElementById('login-form');
        const loginError = document.getElementById('login-error');
        const logoutBtn = document.getElementById('logout-btn');
        const userEmailDisplay = document.getElementById('user-email-display');
        
        const productForm = document.getElementById('product-form');
        const imagesInput = document.getElementById('prod-images');
        const previewContainer = document.getElementById('image-preview-container');
        const submitBtn = document.getElementById('submit-btn');
        const metricProductsCount = document.getElementById('metric-products-count');

        async function updateDashboardMetrics() {
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                metricProductsCount.textContent = querySnapshot.size;
            } catch (error) {
                console.error("Erro ao buscar métricas:", error);
                metricProductsCount.textContent = "0";
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginScreen.classList.add('hidden');
                adminPanel.classList.remove('hidden');
                userEmailDisplay.textContent = user.email;
                updateDashboardMetrics();
            } else {
                adminPanel.classList.add('hidden');
                loginScreen.classList.remove('hidden');
            }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginError.classList.add('hidden');
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('login-email').value, document.getElementById('login-password').value);
            } catch (error) {
                loginError.textContent = "Erro ao entrar: Verifique suas credenciais.";
                loginError.classList.remove('hidden');
            }
        });

        logoutBtn.addEventListener('click', async () => {
            try { await signOut(auth); } catch (error) { console.error(error); }
        });

        imagesInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            previewContainer.innerHTML = '';
            if (files.length > 10) {
                alert('Máximo de 10 imagens permitidas.');
                imagesInput.value = '';
                previewContainer.classList.add('hidden');
                return;
            }
            if (files.length > 0) {
                previewContainer.classList.remove('hidden');
                files.forEach((file, index) => {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        const div = document.createElement('div');
                        div.className = 'relative border rounded-lg p-2 bg-gray-50 flex flex-col items-center';
                        div.innerHTML = `<span class="absolute top-1 left-1 bg-indigo-600 text-white text-xs px-1.5 py-0.5 rounded">#${index + 1}</span><img src="${evt.target.result}" class="h-20 w-20 object-cover rounded-md mb-1"><span class="text-xs text-gray-500">0${index + 1}.webp</span>`;
                        previewContainer.appendChild(div);
                    };
                    reader.readAsDataURL(file);
                });
            } else {
                previewContainer.classList.add('hidden');
            }
        });

        productForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const sku = document.getElementById('prod-sku').value.trim().toUpperCase();
            const name = document.getElementById('prod-name').value;
            const category = document.getElementById('prod-category').value;
            const priceWholesale = parseFloat(document.getElementById('prod-price-wholesale').value);
            const priceRetail = parseFloat(document.getElementById('prod-price-retail').value);
            const files = imagesInput.files;

            if (!sku) return alert('Informe o SKU.');

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Salvando...';

            try {
                // Estrutura de pasta individual por SKU: products/SKU/01.webp, 02.webp...
                const cdnBaseFolder = `https://cdn.jsdelivr.net/gh/${CDN_USER}/${CDN_REPO}@${CDN_BRANCH}/products/${sku}/`;
                const imageUrls = Array.from(files).map((_, i) => cdnBaseFolder + String(i + 1).padStart(2, '0') + '.webp');

                await addDoc(collection(db, "products"), {
                    sku, name, category, priceWholesale, priceRetail, images: imageUrls, createdAt: new Date().toISOString()
                });

                alert(`Produto ${sku} cadastrado com sucesso! Lembre-se de subir as fotos para a pasta "products/${sku}/" no repositório luary-cdn.`);
                productForm.reset();
                previewContainer.classList.add('hidden');
                updateDashboardMetrics();
            } catch (error) {
                console.error(error);
                alert("Erro ao salvar produto.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up mr-2"></i>Salvar Produto no Firestore';
            }
        });
    </script>
</body>
</html>
